name: BSE Announcement Alert

on:
  schedule:
    # Recovery watchdog. Normal cadence is maintained inside the worker.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      cycles:
        description: "Five-minute cycles before handoff (1–60; normally 60)"
        required: false
        default: "60"

permissions:
  contents: write
  actions: write

concurrency:
  group: bse-announcement-alert
  cancel-in-progress: false

jobs:
  scan:
    if: vars.ALERTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify alert pipeline
        run: python -m pytest -q tests/test_alert_pipeline.py tests/test_bse_client.py tests/test_email_sender.py tests/test_main.py
      - name: Poll, checkpoint, and deliver
        id: worker
        run: python -u -m src.worker --cycles "$WORKER_CYCLES"
        env:
          WORKER_CYCLES: ${{ inputs.cycles || '60' }}
          GITHUB_TOKEN: ${{ github.token }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          ALERT_WORKERS: "4"
          EXCHANGE_REQUESTS_PER_SECOND: "2"
          EMAIL_BATCH_SIZE: "20"
          EMAIL_DAILY_LIMIT: "450"
      - name: Start successor worker
        if: ${{ steps.worker.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run announcement-alert.yml --ref main
